version: '3.8'
services:
  back-despachos:
    image: ${ECR_REGISTRY}/repo-backend-despachos:latest
    container_name: api_despachos
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://10.0.2.232:3306/db_sistema # Conexión a DB Privada!
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password_seguro

  back-ventas:
    image: ${ECR_REGISTRY}/repo-backend-ventas:latest
    container_name: api_ventas
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://10.0.2.232:3306/db_sistema # Conexión a DB Privada!
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password_seguro