name: Pipeline CI/CD AWS 3-Capas

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    name: Build, Push y Deploy Distribuido
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # --- 1. CONSTRUCCIÓN Y SUBIDA A ECR ---
      - name: Build y Push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/repo-frontend-innovatech:latest "./proyecto semestral/front_despacho"
          docker push $ECR_REGISTRY/repo-frontend-innovatech:latest

      - name: Build y Push Backends
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/repo-backend-despachos:latest "./proyecto semestral/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO"
          docker push $ECR_REGISTRY/repo-backend-despachos:latest
          docker build -t $ECR_REGISTRY/repo-backend-ventas:latest "./proyecto semestral/back-Ventas_SpringBoot/Springboot-API-REST"
          docker push $ECR_REGISTRY/repo-backend-ventas:latest

      # --- 2. DESPLIEGUE DB (PrivateDB-EV2) ---
      - name: Deploy Base de Datos
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PRIVATE_DB_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            timeout 300s bash -c 'while ! command -v docker &> /dev/null; do echo "Esperando Docker..."; sleep 10; done'
            if [ ! -d "mi-proyecto" ]; then git clone https://github.com/DiVilota/DevOps_2.git mi-proyecto; fi
            cd mi-proyecto && git pull origin deploy
            sudo docker compose -f docker-compose-db.yml up -d || sudo docker-compose -f docker-compose-db.yml up -d

      # --- 3. DESPLIEGUE BACKEND (PrivateWeb-EV2) ---
      - name: Deploy Backends
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PRIVATE_BACK_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            timeout 300s bash -c 'while ! command -v docker &> /dev/null; do echo "Esperando Docker..."; sleep 10; done'
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            if [ ! -d "mi-proyecto" ]; then git clone https://github.com/DiVilota/DevOps_2.git mi-proyecto; fi
            cd mi-proyecto && git pull origin deploy
            sudo docker compose -f docker-compose-back.yml pull || sudo docker-compose -f docker-compose-back.yml pull
            sudo docker compose -f docker-compose-back.yml up -d || sudo docker-compose -f docker-compose-back.yml up -d

      # --- 4. DESPLIEGUE FRONTEND (PublicWeb-EV2) ---
      - name: Deploy Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            timeout 300s bash -c 'while ! command -v docker &> /dev/null; do echo "Esperando Docker..."; sleep 10; done'
            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            if [ ! -d "mi-proyecto" ]; then git clone https://github.com/DiVilota/DevOps_2.git mi-proyecto; fi
            cd mi-proyecto && git pull origin deploy
            sudo docker compose -f docker-compose-front.yml pull || sudo docker-compose -f docker-compose-front.yml pull
            sudo docker compose -f docker-compose-front.yml up -d || sudo docker-compose -f docker-compose-front.yml up -d
