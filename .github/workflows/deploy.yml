name: Pipeline CI/CD - Innovatech Chile

# El pipeline se activa únicamente con push a la rama 'deploy' (Requisito de pauta)
on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    name: Construir, Publicar y Desplegar
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código fuente del repositorio
      - name: Checkout del código
        uses: actions/checkout@v3

      # 2. Configurar credenciales seguras mediante GitHub Secrets (IE7)
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Crítico para tu cuenta AWS Learner Lab
          aws-region: us-east-1

      # 3. Autenticarse en el registro de Amazon ECR
      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # 4a. Construir y Subir la Imagen del Frontend
      - name: Build y Push - Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: repo-frontend-innovatech # Cambia esto por el nombre exacto de tu repo en ECR
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG "./proyecto semestral/front_despacho"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 4b. Construir y Subir la Imagen del Backend (Despachos)
      - name: Build y Push - Backend Despachos
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: repo-backend-despachos # Cambia esto por tu repo en ECR
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG "./proyecto semestral/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 4c. Construir y Subir la Imagen del Backend (Ventas)
      - name: Build y Push - Backend Ventas
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: repo-backend-ventas # Cambia esto por tu repo en ECR
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG "./proyecto semestral/back-Ventas_SpringBoot/Springboot-API-REST"
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 5. Despliegue Automático en EC2 (IE4)
      - name: Despliegue en la Instancia EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando despliegue automatizado..."
            # 1. Entramos a la carpeta de nuestro proyecto en el servidor
            cd /home/ec2-user/mi-proyecto

            # 2. Descargamos los últimos cambios del repositorio
            git pull origin deploy

            # 3. Nos logueamos a ECR desde la instancia
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # 4. Descargamos las imágenes frescas que acabamos de subir
            docker compose pull

            # 5. Reiniciamos los servicios actualizados (sin caída gracias a -d)
            docker compose up -d

            # 6. Limpieza para ahorrar espacio
            docker image prune -f
