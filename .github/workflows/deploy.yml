name: Pipeline CI/CD AWS 3-Capas

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    name: Build, Push y Deploy Distribuido
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # --- 1. CONSTRUCCIÓN ---
      - name: Build y Push Frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/repo-frontend-innovatech:latest "./proyecto semestral/front_despacho"
          docker push $ECR_REGISTRY/repo-frontend-innovatech:latest

      - name: Build y Push Backends
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $ECR_REGISTRY/repo-backend-despachos:latest "./proyecto semestral/back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO"
          docker push $ECR_REGISTRY/repo-backend-despachos:latest
          docker build -t $ECR_REGISTRY/repo-backend-ventas:latest "./proyecto semestral/back-Ventas_SpringBoot/Springboot-API-REST"
          docker push $ECR_REGISTRY/repo-backend-ventas:latest

      # --- 2. DEPLOY DB  ---
      - name: Deploy Base de Datos
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PRIVATE_DB_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo yum install docker git -y
            sudo systemctl start docker
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            if [ ! -d "mi-proyecto" ]; then git clone https://github.com/DiVilota/DevOps_2.git mi-proyecto; fi
            cd mi-proyecto && git pull origin deploy
            sudo /usr/local/bin/docker-compose -f docker-compose-db.yml up -d

      # --- 3. DEPLOY BACKEND ---
      - name: Deploy Backends
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PRIVATE_BACK_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          proxy_host: ${{ secrets.EC2_PUBLIC_IP }}
          proxy_username: ec2-user
          proxy_key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo yum install docker git -y
            sudo systemctl start docker
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

            if [ ! -d "mi-proyecto" ]; then git clone https://github.com/DiVilota/DevOps_2.git mi-proyecto; fi
            cd mi-proyecto && git pull origin deploy

            # Pasamos la variable ECR_REGISTRY directamente al comando sudo
            sudo ECR_REGISTRY=$ECR_REGISTRY /usr/local/bin/docker-compose -f docker-compose-back.yml pull
            sudo ECR_REGISTRY=$ECR_REGISTRY /usr/local/bin/docker-compose -f docker-compose-back.yml up -d

      # --- 4. DEPLOY FRONTEND ---
      - name: Deploy Frontend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo yum install docker git -y
            sudo systemctl start docker
            sudo curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose

            export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            export AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

            aws ecr get-login-password --region us-east-1 | sudo docker login --username AWS --password-stdin $ECR_REGISTRY

            if [ ! -d "mi-proyecto" ]; then git clone https://github.com/DiVilota/DevOps_2.git mi-proyecto; fi
            cd mi-proyecto && git pull origin deploy

            sudo ECR_REGISTRY=$ECR_REGISTRY /usr/local/bin/docker-compose -f docker-compose-front.yml pull
            sudo ECR_REGISTRY=$ECR_REGISTRY /usr/local/bin/docker-compose -f docker-compose-front.yml up -d
